version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trello-db
    environment:
      POSTGRES_USER: trello
      POSTGRES_PASSWORD: trello_password
      POSTGRES_DB: trello
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trello"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trello-backend
    environment:
      DATABASE_URL: "postgresql://trello:trello_password@postgres:5432/trello?schema=public"
      PORT: 3223
    ports:
      - "3223:3223"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trello-frontend
    ports:
      - "3224:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3223

volumes:
  postgres_data:
